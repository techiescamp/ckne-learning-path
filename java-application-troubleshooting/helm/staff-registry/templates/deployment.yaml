apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "staff-registry.appName" . }}
  labels:
    {{- include "staff-registry.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.app.replicas }}
  selector:
    matchLabels:
      app: {{ include "staff-registry.appName" . }}
  template:
    metadata:
      labels:
        app: {{ include "staff-registry.appName" . }}
    spec:
      containers:
        - name: {{ include "staff-registry.appName" . }}
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag }}"
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.app.port }}
              name: http
          env:
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-app-config
                  key: DB_URL
            - name: DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-app-config
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgres-secret
                  key: POSTGRES_PASSWORD
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
          {{- if .Values.probes.enabled }}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ .Values.app.port }}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ .Values.app.port }}
            periodSeconds: 10
            timeoutSeconds: 5
          {{- end }}
